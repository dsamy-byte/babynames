[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "babynames"
version = "0.1.0"
description = "A local Streamlit application for exploring U.S. baby-name trends."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "sammy", email = "dsamyuktha@gmail.com" },
]
dependencies = [
  "altair>=5,<7",
  "pandas>=2.2,<4",
  "pyarrow>=18,<25",
  "streamlit>=1.45,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pandas-stubs>=2.2,<4",
  "pip-audit>=2.8,<3",
  "playwright>=1.55,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
babynames-validate = "babynames.data_validation:main"
babynames-build = "babynames.data_pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["babynames"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = ["D203", "D213"]
