[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "babynames"
version = "0.1.0"
description = "A local Streamlit application for exploring U.S. baby-name trends."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "sammy", email = "dsamyuktha@gmail.com" },
]
dependencies = [
  "pandas>=2.2,<4",
  "pyarrow>=18,<25",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
babynames-validate = "babynames.data_validation:main"
babynames-build = "babynames.data_pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = ["D203", "D213"]
